- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    # Shell
    ~/.aliases: shell/.aliases
    ~/.profile: shell/.profile
    ~/.zshenv: shell/.zshenv
    ~/.zshrc: shell/.zshrc

    # Fish
    ~/.config/fish/config.fish: fish/.config/fish/config.fish
    ~/.config/fish/fish_plugins: fish/.config/fish/fish_plugins
    ~/.config/fish/conf.d/fish_frozen_theme.fish: fish/.config/fish/conf.d/fish_frozen_theme.fish
    ~/.config/fish/conf.d/hydro-config.fish: fish/.config/fish/conf.d/hydro-config.fish

    # Git
    ~/.gitconfig: git/.gitconfig

    # Mise
    ~/.config/mise/config.toml:
      path: mise/.config/mise/config.toml
      create: true

    # Karabiner
    ~/.config/karabiner/karabiner.json:
      path: karabiner/.config/karabiner/karabiner.json
      force: true
    ~/.config/karabiner/assets:
      path: karabiner/.config/karabiner/assets
      force: true

    # Homebrew
    ~/Brewfile: homebrew/Brewfile

    # Opencode
    ~/.config/opencode:
      path: opencode/.config/opencode
      force: true

    # Claude
    ~/.claude.json: claude/.claude.json
    ~/.claude:
      path: claude/.claude
      force: true

    # Agents
    ~/.agents:
      path: agents/.agents
      force: true

    # Zed
    ~/.config/zed/settings.json:
      path: zed/.config/zed/settings.json
      force: true

    # GitHub CLI
    ~/.config/gh/config.yml:
      path: gh/.config/gh/config.yml
      force: true

    # QMD
    ~/.config/qmd/index.yml:
      path: qmd/.config/qmd/index.yml
      force: true

# Plugins
- brewfile:
    - homebrew/Brewfile

- mise:
    - install
